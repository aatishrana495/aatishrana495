<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" role="img" aria-label="Aatish Rana — ML systems, compilers, on-device AI">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: none; stroke: #21262d; stroke-width: 1; }
      .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 38px; font-weight: 600; fill: #e6edf3; letter-spacing: 0.5px; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #8b949e; letter-spacing: 0.3px; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #6e7681; letter-spacing: 0.3px; }
      .node { fill: none; stroke: #30363d; stroke-width: 1.25; }
      .edge { fill: none; stroke: #30363d; stroke-width: 1.25; stroke-linecap: round; }
      .active { stroke: #58a6ff; }
      .dot { fill: #58a6ff; }
    </style>
  </defs>

  <rect class="bg" width="820" height="180"/>
  <rect class="frame" x="0.5" y="0.5" width="819" height="179"/>

  <text class="name" x="42" y="82">Aatish Rana</text>
  <text class="tag"  x="44" y="112">ML systems  ·  compilers  ·  on-device AI</text>
  <text class="sub"  x="44" y="134">Qualcomm  ·  IIT Madras</text>

  <g transform="translate(530, 40)">
    <circle class="node"        cx="20"  cy="50" r="10"/>
    <circle class="node"        cx="90"  cy="20" r="10"/>
    <circle class="node"        cx="90"  cy="80" r="10"/>
    <circle class="node active" cx="160" cy="50" r="10"/>
    <circle class="node"        cx="230" cy="20" r="10"/>
    <circle class="node"        cx="230" cy="80" r="10"/>

    <line class="edge"        x1="30"  y1="50" x2="80"  y2="20"/>
    <line class="edge"        x1="30"  y1="50" x2="80"  y2="80"/>
    <line class="edge active" x1="100" y1="20" x2="150" y2="50"/>
    <line class="edge active" x1="100" y1="80" x2="150" y2="50"/>
    <line class="edge"        x1="170" y1="50" x2="220" y2="20"/>
    <line class="edge"        x1="170" y1="50" x2="220" y2="80"/>

    <circle class="dot" cx="160" cy="50" r="3"/>
  </g>
</svg>
